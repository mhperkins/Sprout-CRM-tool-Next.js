  /* Always three equal rows, so each act is a third of the screen and a
     2-act slide lines up with the 3-act slides. */
  .cards{display:grid; grid-template-rows:repeat(3, minmax(0,1fr)); gap:min(1.4vw,2.4vh); flex:1; min-height:0;}
  .card{display:flex; align-items:center; gap:min(2.6vw,4.4vh); min-height:0; overflow:hidden;}
  /* Left column: photo on top (takes whatever height the name leaves), name + handle below. */
  .left{flex:0 0 min(21vw,35vh); height:100%; min-width:0; min-height:0; display:flex; flex-direction:column;}
  .left img{flex:1 1 0; min-height:0; width:100%; object-fit:cover; border-radius:min(1vw,1.8vh); display:block; background:#222;}
  .name{font-size:min(1.85vw,3.3vh); font-weight:900; line-height:1.08; margin-top:min(.6vw,1vh); flex-shrink:0;}
  .handle{font-size:min(1.3vw,2.3vh); font-weight:900; margin-top:min(.2vw,.35vh); flex-shrink:0;}
  .bio{flex:1; min-width:0; line-height:1.3; color:#f0f0ec; white-space:pre-line;}
&lt;/style&gt;
&lt;/head&gt;

  function fitBios(){
    var cards=[].slice.call(document.querySelectorAll(&#x27;.card&#x27;));
    var W=window.innerWidth, H=window.innerHeight;
    var size=Math.round(Math.min(W*0.036, H*0.062));
    function over(){
      return cards.some(function(c){
        var h=c.clientHeight, b=c.querySelector(&#x27;.bio&#x27;);
        return b.scrollHeight&gt;h+1;
      });
    }
    function apply(){ cards.forEach(function(c){ c.querySelector(&#x27;.bio&#x27;).style.fontSize=size+&#x27;px&#x27;; }); }
    apply();
    while(over() &amp;&amp; size&gt;12){ size-=1; apply(); }
    document.body.setAttribute(&#x27;data-bio-px&#x27;, size);
  }
  window.addEventListener(&#x27;load&#x27;, fitBios);
  window.addEventListener(&#x27;resize&#x27;, fitBios);
  if(document.fonts &amp;&amp; document.fonts.ready){ document.fonts.ready.then(fitBios); }

  .note-qr{width:min(6.4vw,11.4vh); height:min(6.4vw,11.4vh); background:#fff; padding:min(.45vw,.8vh); border-radius:min(.7vw,1.2vh); display:block; flex-shrink:0;}
  /* flex-shrink:0 is load-bearing: a childless bar in a column flex collapses to 0 without it. */
  .rule{height:min(.4vw,.7vh); width:min(8vw,14vh); border-radius:.3vw; margin:min(.9vw,1.6vh) 0 min(1.3vw,2.3vh); flex-shrink:0;}
  .a-fuchsia .eyebrow, .a-fuchsia .hl{color:var(--fuchsia);}
  .a-cyan .eyebrow, .a-cyan .hl{color:var(--cyan);}
  .a-fuchsia .rule{background:var(--fuchsia);}
  .a-cyan .rule{background:var(--cyan);}

  /* ---- lineup rows ------------------------------------------- */
  /* Always three equal rows, so each act is a third of the screen and a
     2-act slide lines up with the 3-act slides. */
  .cards{display:grid; grid-template-rows:repeat(2, minmax(0,1fr)); gap:min(1.4vw,2.4vh); flex:1; min-height:0;}
  .card{display:flex; align-items:center; gap:min(2.6vw,4.4vh); min-height:0; overflow:hidden;}
  /* Left column: photo on top (takes whatever height the name leaves), name + handle below. */
  .left{flex:0 0 min(21vw,35vh); height:100%; min-width:0; min-height:0; display:flex; flex-direction:column;}
  .left img{flex:1 1 0; min-height:0; width:100%; object-fit:cover; border-radius:min(1vw,1.8vh); display:block; background:#222;}
  .name{font-size:min(1.85vw,3.3vh); font-weight:900; line-height:1.08; margin-top:min(.6vw,1vh); flex-shrink:0;}
  .handle{font-size:min(1.3vw,2.3vh); font-weight:900; margin-top:min(.2vw,.35vh); flex-shrink:0;}
  .bio{flex:1; min-width:0; line-height:1.3; color:#f0f0ec; white-space:pre-line;}
&lt;/style&gt;
&lt;/head&gt;

&lt;script&gt;
  function fitBios(){
    var cards=[].slice.call(document.querySelectorAll(&#x27;.card&#x27;));
    var W=window.innerWidth, H=window.innerHeight;
    var size=Math.round(Math.min(W*0.036, H*0.062));
    function over(){
      return cards.some(function(c){
        var h=c.clientHeight, b=c.querySelector(&#x27;.bio&#x27;);
        return b.scrollHeight&gt;h+1;
      });
    }
    function apply(){ cards.forEach(function(c){ c.querySelector(&#x27;.bio&#x27;).style.fontSize=size+&#x27;px&#x27;; }); }
    apply();
    while(over() &amp;&amp; size&gt;12){ size-=1; apply(); }
    document.body.setAttribute(&#x27;data-bio-px&#x27;, size);
  }
  window.addEventListener(&#x27;load&#x27;, fitBios);
  window.addEventListener(&#x27;resize&#x27;, fitBios);
  if(document.fonts &amp;&amp; document.fonts.ready){ document.fonts.ready.then(fitBios); }
&lt;/script&gt;

    font-family:&#x27;Lato&#x27;,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--ink); color:var(--ink);
  }

  /* ---- slide plumbing ---------------------------------------- */
  .deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding:5.5vw 6vw 7vw;
    opacity:0; transition:opacity .9s ease;
    pointer-events:none;
  }
  .slide.on{opacity:1;}
  .slide.dark{background:var(--ink); color:#fff;}
  .slide.light{background:var(--paper); color:var(--ink);}

  /* ---- shared type ------------------------------------------- */
  .eyebrow{
    font-size:1.5vw; font-weight:900; letter-spacing:.35em;
    text-transform:uppercase; margin-bottom:1.6vw;
  }
  h1{font-size:6.6vw; font-weight:900; line-height:1.02; letter-spacing:-.02em;}
  h2{font-size:4.6vw; font-weight:900; line-height:1.08; letter-spacing:-.015em;}
  .lead{font-size:2.5vw; font-weight:700; line-height:1.4; max-width:60vw;}
  .body{font-size:1.85vw; font-weight:400; line-height:1.55; max-width:52vw;}
  .dark .body{color:#d8d8d4;}
  .light .body{color:#3a3a38;}
  /* flex-shrink:0 is load-bearing. The slide is a column flex container,
     so a childless bar like this collapses to height 0 without it. */
  .rule{height:.65vw; width:11vw; border-radius:.4vw; margin:2.4vw 0; flex-shrink:0;}

  /* ---- accents ----------------------------------------------- */
  .a-acid    .eyebrow, .a-acid    .hl{color:var(--acid);}
  .a-fuchsia .eyebrow, .a-fuchsia .hl{color:var(--fuchsia);}
  .a-cyan    .eyebrow, .a-cyan    .hl{color:var(--cyan);}
  .a-banana  .eyebrow, .a-banana  .hl{color:var(--banana);}
  .light.a-cyan .eyebrow, .light.a-cyan .hl{color:var(--cyan-deep);}
  .a-acid    .rule{background:var(--acid);}
  .a-fuchsia .rule{background:var(--fuchsia);}
  .a-cyan    .rule{background:var(--cyan);}
  .light.a-cyan .rule{background:var(--cyan-deep);}
  .a-banana  .rule{background:var(--banana);}

  /* ---- layout helpers ---------------------------------------- */
  .row{display:flex; align-items:center; justify-content:space-between; gap:5vw; flex-shrink:0;}
  .col{flex:1; min-width:0;}
  /* align-self keeps width:auto honest. In a column flex container the
     cross axis is horizontal, so without it the logo stretches full-width
     and the aspect ratio blows out. */
  .logo{height:9vw; width:auto; display:block; margin-bottom:3vw; align-self:flex-start; flex-shrink:0;}
  .logo-sm{height:4.4vw; width:auto; display:block; align-self:flex-start; flex-shrink:0;}

  /* ---- QR block ---------------------------------------------- */
  /* Fixed block width so the code lands in the same spot on every
     slide. Sizing to content lets a longer caption shift it sideways,
     which reads as a jump during the cross-fade. */
  .qr{flex:0 0 25vw; text-align:center;}
  .qr img{
    width:23vw; height:23vw; display:block; margin:0 auto;
    background:#fff; padding:1vw; border-radius:1.2vw;
  }
  .qr-cap{
    font-size:1.25vw; font-weight:900; line-height:1.35;
    margin-top:1.1vw; max-width:100%; text-transform:uppercase; letter-spacing:.06em;
  }
  .dark .qr-cap{color:#fff;}

  /* ---- stat row (story slide) -------------------------------- */
  .stats{display:flex; gap:4.5vw; margin-top:2.6vw;}
  .stat b{display:block; font-size:3.4vw; font-weight:900; line-height:1;}
  .stat span{display:block; font-size:1.15vw; font-weight:700; color:var(--muted); margin-top:.5vw; text-transform:uppercase; letter-spacing:.08em;}

  /* ---- price rows (membership slide) ------------------------- */
  .prices{margin:2.4vw 0 0; max-width:34vw;}
  .price{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:1.3vw 0; border-bottom:1px solid rgba(255,255,255,.16);
  }
  .price:last-child{border-bottom:0;}
  .price span{font-size:2vw; font-weight:700;}
  .price b{font-size:3vw; font-weight:900;}

  /* ---- date pill (SnT slide) --------------------------------- */
  .pill{
    display:inline-block; background:var(--fuchsia); color:#fff;
    font-size:2vw; font-weight:900; padding:1vw 2.2vw; border-radius:99vw;
    margin-top:2.4vw;
  }

  /* ---- footer + progress ------------------------------------- */
  .foot{
    position:absolute; left:6vw; right:6vw; bottom:3vw;
    display:flex; align-items:center; justify-content:space-between;
    font-size:1.1vw; font-weight:700; letter-spacing:.04em;
  }
  .dark .foot{color:#7a7a76;}
  .light .foot{color:var(--muted);}
  .dots{display:flex; gap:.8vw;}
  .dot{width:.75vw; height:.75vw; border-radius:50%; background:currentColor; opacity:.28; transition:opacity .3s, transform .3s;}
  .dot.on{opacity:1; transform:scale(1.35);}
  .bar{
    position:absolute; left:0; bottom:0; height:.45vw; width:0%;
    background:var(--acid); transition:width .25s linear;
  }
  .paused .bar{background:var(--muted);}

<div id="hint">Space = pause &middot; Arrows = step &middot; F = fullscreen &middot; Click = next</div>
<script>
  var frames=[].slice.call(document.querySelectorAll('.frame'));
  var dots=[].slice.call(document.querySelectorAll('#dots i'));
  var prog=document.getElementById('prog');
  var i=0, paused=false, timer=null, DUR=17000;
  function paint(){
    frames.forEach(function(f,n){ f.classList.toggle('on', n===i); });
    dots.forEach(function(d,n){ d.classList.toggle('on', n===i); });
  }
  function run(){
    clearTimeout(timer);
    prog.style.transition='none'; prog.style.width='0%';
    void prog.offsetWidth;
    if(!paused){
      prog.style.transition='width '+DUR+'ms linear';
      prog.style.width='100%';
      timer=setTimeout(next, DUR);
    }
  }
  function show(n){ i=(n+frames.length)%frames.length; paint(); run(); }
  function next(){ show(i+1); }
  function prev(){ show(i-1); }
  function togglePause(){
    paused=!paused;
    if(paused){
      clearTimeout(timer);
      var w=getComputedStyle(prog).width;
      prog.style.transition='none'; prog.style.width=w;
    } else { run(); }
  }
  function toggleFS(){
    if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
    else { (document.exitFullscreen||function(){}).call(document); }
  }
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'){ e.preventDefault(); togglePause(); }
    else if(e.key==='ArrowRight'){ next(); }
    else if(e.key==='ArrowLeft'){ prev(); }
    else if(e.key==='f'||e.key==='F'){ toggleFS(); }
  });
  document.body.addEventListener('click', function(){ next(); });
  paint(); run();
</script>
