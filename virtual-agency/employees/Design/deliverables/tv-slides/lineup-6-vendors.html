<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sprout Society: Tonight&#x27;s Vendors</title>

<!-- ============================================================
     SPROUT SOCIETY TV SLIDE LINEUP 1: TONIGHT'S ARTISTS
     Sprout N Tell Vol. 5 x Buzzkill NYC (2026-10-23). Event-specific: swap or remove
     after tonight. Photos + bios come from the program form submissions
     (sprout_program_entries). Long bios are cut to their first sentence.
     ============================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#030000; --acid:#C6C902; --banana:#FAD100;
    --fuchsia:#E10098; --cyan:#73C4D6; --cyan-deep:#2a8ca0;
    --paper:#F7F7F6; --muted:#8a8a86;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{font-family:'Lato',-apple-system,Segoe UI,Roboto,sans-serif; background:var(--ink); color:#fff;}
  .deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
  .slide{position:absolute; inset:0; display:flex; flex-direction:column;
         padding:min(2.6vw,4.2vh) min(5vw,8vh) min(2.6vw,4.2vh);}
  .slide.dark{background:var(--ink); color:#fff;}

  .head{display:flex; align-items:center; justify-content:space-between; gap:3vw; flex-shrink:0;}
  .eyebrow{font-size:min(1.1vw,2vh); font-weight:900; letter-spacing:.35em; text-transform:uppercase; margin-bottom:min(.5vw,.9vh);}
  h2{font-size:min(3vw,5.3vh); font-weight:900; line-height:1.05; letter-spacing:-.015em;}
  /* Program callout: prominent text + a small QR to tonight's program (same tracked code as slide 1). */
  .note{display:flex; align-items:center; gap:min(1.2vw,2.1vh);}
  .note-text{font-size:min(1.75vw,3.1vh); font-weight:900; line-height:1.25; color:#fff; text-align:right;}
  .note-text .hl{display:block;}
  .note-qr{width:min(6.4vw,11.4vh); height:min(6.4vw,11.4vh); background:#fff; padding:min(.45vw,.8vh); border-radius:min(.7vw,1.2vh); display:block; flex-shrink:0;}
  /* flex-shrink:0 is load-bearing: a childless bar in a column flex collapses to 0 without it. */
  .rule{height:min(.4vw,.7vh); width:min(8vw,14vh); border-radius:.3vw; margin:min(.9vw,1.6vh) 0 min(1.3vw,2.3vh); flex-shrink:0;}
  .a-fuchsia .eyebrow, .a-fuchsia .hl{color:var(--fuchsia);}
  .a-cyan .eyebrow, .a-cyan .hl{color:var(--cyan);}
  .a-fuchsia .rule{background:var(--fuchsia);}
  .a-cyan .rule{background:var(--cyan);}

  /* ---- lineup rows ------------------------------------------- */
  /* Always three equal rows, so each act is a third of the screen and a
     2-act slide lines up with the 3-act slides. */
  .cards{display:grid; grid-template-rows:repeat(3, minmax(0,1fr)); gap:min(1.4vw,2.4vh); flex:1; min-height:0;}
  .card{display:flex; align-items:center; gap:min(2.6vw,4.4vh); min-height:0; overflow:hidden;}
  /* Left column: photo on top (takes whatever height the name leaves), name + handle below. */
  .left{flex:0 0 min(21vw,35vh); height:100%; min-width:0; min-height:0; display:flex; flex-direction:column;}
  .left img{flex:1 1 0; min-height:0; width:100%; object-fit:cover; border-radius:min(1vw,1.8vh); display:block; background:#222;}
  .name{font-size:min(1.85vw,3.3vh); font-weight:900; line-height:1.08; margin-top:min(.6vw,1vh); flex-shrink:0;}
  .handle{font-size:min(1.3vw,2.3vh); font-weight:900; margin-top:min(.2vw,.35vh); flex-shrink:0;}
  .bio{flex:1; min-width:0; line-height:1.3; color:#f0f0ec; white-space:pre-line;}
  .a-banana .eyebrow, .a-banana .hl{color:var(--banana);}
  .a-banana .rule{background:var(--banana);}
  .left .ph{flex:1 1 0; min-height:0; width:100%; border-radius:min(1vw,1.8vh); background:#222;
            display:flex; align-items:center; justify-content:center;
            font-size:min(6vw,10vh); font-weight:900; color:var(--banana);}
</style>
</head>
<body>

<div class="deck">
  <div class="slide dark a-banana">
    <div class="head">
      <div>
        <div class="eyebrow">Sprout N Tell Vol. 5 x Buzzkill NYC</div>
        <h2>Tonight&#x27;s Vendors</h2>
      </div>
      <div class="note">
        <div class="note-text">Full bios, links, and tips<span class="hl">are in tonight's program.</span></div>
        <img class="note-qr" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0AQMAAAAHA5RxAAAABlBMVEX///8AAABVwtN+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAACCklEQVRYhb2XMa6EMAxEHVFQ5kbhWhRIQaLgWuEme4SUFAj/GcOu9hfb4VBEq5eVMGN74oj8eLKqljgH3QfVrU6hkrwe46NIv+l6ioQ68XVcuwZ80LVELZJLXM44J5kGXdrwjVsIaUr8QzteuOqmR6gdUtCGU/86htojHonH8J2XBzirCDzFFW9Mcdm+6s2T30+Ku/XIUv63jRvH71V1RzwoKqEUCGny58jsHKpY284D+1eCHg14YF2hbZF3qKGI6qqrhzgIVaU11XyaxG+jcOW9mQPWFY6UrMyU8bjzjcnFt9OHlX3alXiIO4cOGVvhUuMq6Wj95cvHxNQzGMt+Z+3cPceRTfiSJKEvYfeENVHnBnyU93mqZrmmszcHXAloxTAHPSWfprMzF/MHpBhTBJWHDon+782RdMZQbj9EXR3J4nTmiGeXeIs/oI/08uGn+GiVPJrCHUcFrvnlz1lRPE9RWgutWO7z3Z9jKMIYNg7V5qL40d+bww93rIFNNIW3/t6cJzh6RzLdw4LZbN5+igfFx+arWYrAD9E+XQNuTpjvc82CwZa4czu4MZnc/iAD1WjAeXBvCIClBSdkchP7yJuPNqKglXh/sXMcrSTyHLd7ypy4NZk7qRlgG77bSMaJ6OPzTTjMEAUGhSe7IuUG3O5NPa2YuUaB3fE486uuGE9g+2QOD1H9+Y/nD0XMN9zTLIziAAAAAElFTkSuQmCC" alt="Scan for tonight's program" />
      </div>
    </div>
    <div class="rule"></div>
    <div class="cards">
      <div class="card">
        <div class="left">
          <div class="ph">JH</div>
          <div class="name">Jillian Howery</div>
          <div class="handle hl">@terrafinajewelry</div>
        </div>
        <p class="bio">Handmade tiny terrarium earrings!</p>
      </div>
    </div>
  </div>
</div>

<script>
  function fitBios(){
    var cards=[].slice.call(document.querySelectorAll('.card'));
    var W=window.innerWidth, H=window.innerHeight;
    var size=Math.round(Math.min(W*0.036, H*0.062));
    function over(){
      return cards.some(function(c){
        var h=c.clientHeight, b=c.querySelector('.bio');
        return b.scrollHeight>h+1;
      });
    }
    function apply(){ cards.forEach(function(c){ c.querySelector('.bio').style.fontSize=size+'px'; }); }
    apply();
    while(over() && size>12){ size-=1; apply(); }
    document.body.setAttribute('data-bio-px', size);
  }
  window.addEventListener('load', fitBios);
  window.addEventListener('resize', fitBios);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitBios); }
</script>
</body>
</html>
