<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One ask thank-you</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#030000;--acid:#C6C902;--banana:#FAD100;--fuchsia:#E10098;--cyan:#73C4D6;--paper:#F7F7F6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Lato,system-ui,sans-serif;color:var(--ink)}
.slide{max-width:900px;margin:32px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.hd{background:var(--ink);color:#fff;padding:28px 36px;border-bottom:5px solid var(--acid)}
.eb{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--acid);font-weight:900}
h1{margin:6px 0 10px;font-size:30px;font-weight:900}
.b{font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px;background:#fff;color:var(--ink);margin-right:6px}.b.c{background:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:28px 36px}
.card{border-radius:10px;padding:18px 20px;background:var(--paper);border-left:6px solid var(--banana);font-size:14px;line-height:1.5}
.card.f{border-color:var(--fuchsia)}.card h3{margin:0 0 6px;font-size:17px}
.ft{padding:0 36px 24px;font-size:12px;color:#6b6b68}
</style></head><body>
<div class="slide">
 <div class="hd"><div class="eb">Delivered · 2026-10-28</div><h1>⭐ One ask on the survey thank-you</h1>
  <span class="b">main</span><span class="b c">merge 1c8f787</span></div>
 <div class="grid">
  <div class="card"><h3>Kept</h3>The Google review card with its copy-and-paste steps.</div>
  <div class="card f"><h3>Removed</h3>The Discord card. Discord stays in the survey emails and the Copy email template.</div>
 </div>
 <div class="ft">components/SurveyForm.jsx · Sprout CRM Next</div>
</div>
</body></html>
