<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kali Instagram Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#030000;--acid:#C6C902;--banana:#FAD100;--fuchsia:#E10098}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lato,system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.slide{max-width:800px;width:100%}
.eyebrow{color:var(--fuchsia);font-weight:900;letter-spacing:.3em;text-transform:uppercase;font-size:13px}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:900;margin:8px 0 6px;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
.badge{border-radius:999px;padding:6px 14px;font-weight:900;font-size:13px}
.b1{background:var(--acid);color:var(--ink)}.b3{background:var(--fuchsia)}
.card{background:#141212;border-radius:14px;padding:20px;border-left:6px solid var(--fuchsia)}
.card h3{font-size:18px;font-weight:900;margin-bottom:8px}
.card p{color:#d8d8d4;font-size:15px;line-height:1.5}
.icon{font-size:26px;margin-bottom:8px}
</style></head><body><div class="slide">
<div class="eyebrow">Sprout CRM · Delivery · 2026-10-24</div>
<h1>Kali Winkler is @kaliwink</h1>
<div class="meta"><span class="badge b1">main · 54cc742</span><span class="badge b3">Live</span></div>
<div class="card"><div class="icon">🎨</div><h3>Instagram fixed everywhere</h3><p>The artists slide, the program's Instagram button, and Kali's saved submission now all point to @kaliwink.</p></div>
</div></body></html>
