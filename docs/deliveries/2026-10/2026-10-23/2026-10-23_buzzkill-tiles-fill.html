<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzzkill Tiles Fill</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#030000;--acid:#C6C902;--banana:#FAD100;--fuchsia:#E10098;--cyan:#73C4D6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lato,system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.slide{max-width:900px;width:100%}
.eyebrow{color:var(--banana);font-weight:900;letter-spacing:.3em;text-transform:uppercase;font-size:13px}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:900;margin:8px 0 6px;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 26px}
.badge{border-radius:999px;padding:6px 14px;font-weight:900;font-size:13px}
.b1{background:var(--acid);color:var(--ink)}.b3{background:var(--fuchsia)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:#141212;border-radius:14px;padding:20px;border-left:6px solid var(--banana)}
.card.c{border-color:var(--cyan)}
.card h3{font-size:18px;font-weight:900;margin-bottom:8px}
.card p{color:#d8d8d4;font-size:15px;line-height:1.5}
.icon{font-size:26px;margin-bottom:8px}
</style></head><body><div class="slide">
<div class="eyebrow">Sprout CRM · Delivery · 2026-10-23</div>
<h1>Buzzkill slide: tiles fill the space</h1>
<div class="meta"><span class="badge b1">main · 2a43f15</span><span class="badge b3">Live</span></div>
<div class="grid">
 <div class="card"><div class="icon">🐝</div><h3>Logo column</h3><p>Sized to the logo itself, pinned to the top on near-square screens.</p></div>
 <div class="card c"><div class="icon">🔳</div><h3>QR tiles</h3><p>Stretch to fill everything beside the logo, with bigger QRs and text.</p></div>
</div></div></body></html>
