<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Emails Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#030000;--paper:#F7F7F6;--acid:#C6C902;--fuchsia:#E10098;--cyan:#73C4D6}
*{box-sizing:border-box}body{margin:0;background:var(--ink);font-family:Lato,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 16px}
.slide{width:100%;max-width:1100px;background:var(--paper);border-radius:14px;overflow:hidden}
.top{background:var(--ink);color:#fff;padding:28px 32px;border-bottom:6px solid var(--acid)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--acid);font-weight:900}
h1{margin:6px 0 10px;font-size:30px;font-weight:900}
.badges{display:flex;flex-wrap:wrap;gap:8px}.b{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#222;color:#fff}
.b.c{background:var(--cyan);color:var(--ink)}.b.f{background:var(--fuchsia)}.b.y{background:var(--acid);color:var(--ink)}
.card{margin:24px 32px 28px;background:#fff;border-radius:10px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.12);border-left:6px solid var(--acid)}
.big{font-size:44px;font-weight:900;line-height:1}.card ul{margin:10px 0 0;padding-left:18px;font-size:14px;line-height:1.5;color:#3a3a38}
</style></head><body><div class="slide">
<div class="top"><div class="eyebrow">Delivered · 2026-11-19</div><h1>Emails taken at events now read the door sign-ins</h1>
<div class="badges"><span class="b">main</span><span class="b c">merge 05c56a5</span><span class="b">ff7db03</span><span class="b y">Effort: low</span><span class="b f">Pushed</span></div></div>
<div class="card"><div class="big">16 → ~91</div><ul><li>A night with no typed number uses its door sign-in count</li><li>A typed Emails collected still wins (Vol. 5 = 16)</li><li>One-time nights only, one per date</li></ul></div>
</div></body></html>
